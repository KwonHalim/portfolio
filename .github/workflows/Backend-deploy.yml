name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'

jobs:
  backend_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # QEMU 설정 (ARM64 아키텍처 에뮬레이션용)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ARM64용 이미지 빌드 및 푸시
      - name: Build and push Docker image for ARM64
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/harimdev-backend
          docker buildx build --platform linux/arm64 -t $IMAGE_NAME:latest --push ./Backend

  backend_deploy:
    needs: backend_build
    runs-on: self-hosted
    steps:
      - name: Deploy to Backend Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USERNAME }}
          password: ${{ secrets.BACKEND_SERVER_PASSWORD }}
          script: |
            IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/harimdev-backend

            docker stop harimdev-backend || true
            docker rm harimdev-backend || true
            docker pull $IMAGE_NAME:latest

            docker run -d --name harimdev-backend -p 8080:8080 \
              --network backend-network \
              -v /home/halim/portfolio/Backend/src/main/resources/application.yml:/app/application.yml \
              -v /home/halim/portfolio/Backend/static-resources:/app/external-static \
              -v /home/halim/logs:/root/spring/logs \
              $IMAGE_NAME:latest

            echo "===== Running containers ====="
            docker ps -a | grep harimdev-backend

            docker image prune -f || true

      - name: Wait for server health check
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.BACKEND_SERVER_HOST }}:8080/actuator/health || true)
            echo "Health check status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
